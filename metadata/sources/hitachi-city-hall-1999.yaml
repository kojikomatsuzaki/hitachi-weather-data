notes:
  - 1999年は1953–2007年一括ZIPに収録された年別Excelを主原資料とする。
  - 1999年の帳票では、気温・湿度・降水量・気圧・風速・風向・露点温度が1時から24時の毎時値である。
  - 全天日射量と日照時間は4時から20時、天気は12時の記録である。
  - 原ZIPと内部Excelの双方についてSHA-256を記録し、原Excelはリポジトリへ複製しない。

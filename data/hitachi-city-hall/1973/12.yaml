notes:
  - 1953–2007年一括ZIP内の1973年Excelから生成した。
  - 原Excelは変更せず、ZIPと内部ExcelのSHA-256を検証した。
  - 古いBIFFレコードを読むため、一時XLSXへ変換した後に値を抽出した。
  - 1時から24時という原資料上の時刻表記をsource_hourへ保持する。
  - 日平均・日合計・最高・最低などは時間値と混在させずdaily_summariesへ収録した。
  - 観測時刻はobservation_schedulesで定義し、当該年の対象外時刻はnot_scheduledで区別する。
  - 公開ZIPに年別原ファイルがない項目は推定せずnull・source_file_unavailableで区別し、日別集計も生成しない。

name: Apply prepared Hitachi update
on:
  push:
    paths:
      - .github/workflows/apply-hitachi-prepared-update.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'kojikomatsuzaki/hitachi-weather-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified update
        shell: bash
        env:
          PATCH_B64: |
            
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | tr -d '\n ' | base64 -d | xz -d > /tmp/update.patch
          echo "26ab9ad61100374f811c40f31275af050c4a3527b456f914ef7d701c9e9c1016  /tmp/update.patch.xz" > /tmp/expected
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          unlink .github/workflows/apply-hitachi-prepared-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1953年1月の観測データと採録方針を追加"
          git push origin HEAD:main

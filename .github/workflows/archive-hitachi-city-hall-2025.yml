name: Archive Hitachi City Hall 2025

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-hitachi-city-hall-2025
  cancel-in-progress: false

jobs:
  archive-year:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import all months of 2025
        shell: bash
        run: |
          set -euo pipefail
          for month in $(seq 1 12); do
            python scripts/import_hitachi_city_hall_2025.py               --month "$month"               --download-missing
          done

      - name: Generate web data
        run: python scripts/generate_web_data.py

      - name: Verify the complete year
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml


          year_directory = Path("data/hitachi-city-hall/2025")
          month_paths = sorted(year_directory.glob("*.yaml"))
          expected_names = [f"{month:02d}.yaml" for month in range(1, 13)]

          if [path.name for path in month_paths] != expected_names:
              raise SystemExit("2025年の月別YAMLが12ファイル揃っていません。")

          for month_path in month_paths:
              document = yaml.safe_load(month_path.read_text(encoding="utf-8"))
              dataset = document["dataset"]
              if dataset["year"] != 2025 or dataset["month"] != int(month_path.stem):
                  raise SystemExit(f"年月がパスと一致しません: {month_path}")

              observation_count = len(document["observations"])
              if observation_count not in {24 * 28, 24 * 30, 24 * 31}:
                  raise SystemExit(
                      f"時刻レコード数が不正です: {month_path} ({observation_count})"
                  )

          print("2025年の12か月を検証しました。")
          PY

      - name: Commit generated archive
        shell: bash
        run: |
          set -euo pipefail
          git add             data/hitachi-city-hall/2025             docs/data/2025             docs/data/index.json             reports/validation-2025-*.md

          if git diff --cached --quiet; then
            echo "生成結果に変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "2025年の全月観測データを追加"
          git push origin HEAD:main

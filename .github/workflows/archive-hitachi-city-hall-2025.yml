name: Apply archive generalization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-hitachi-city-hall-2025.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply prepared files
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/generalize.tar.xz
          tar -xJf /tmp/generalize.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs metadata/sources/hitachi-city-hall-2025.yaml scripts/discover_hitachi_city_hall_sources.py scripts/import_hitachi_city_hall_year.py
          git commit -m "日立市役所の年別採録処理を一般化"
          git push origin HEAD:main

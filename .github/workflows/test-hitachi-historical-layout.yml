name: Test historical Excel layout parser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run layout unit tests
        run: python -m unittest discover -s tests -p 'test_hitachi_historical_layout.py' -v
      - name: Run existing regression suite
        run: python -m unittest discover -s tests -v

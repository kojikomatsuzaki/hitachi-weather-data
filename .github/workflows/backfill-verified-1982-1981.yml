name: Verify and backfill 1982 through 1981 (stop on error)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitachi-verified-bounded-backfill
  cancel-in-progress: false
jobs:
  sequential-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: build/historical-archives
          key: hitachi-city-hall-historical-archives-v1
      - name: Install readers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc
          python -m pip install -r requirements.txt
      - name: Independently verify and publish one year at a time
        run: python scripts/archive_verified_historical_range.py --start-year 1982 --end-year 1981
      - name: Upload evidence and generated data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitachi-verified-1982-1981
          path: |
            build/*integration-198[1-2].json
            data/hitachi-city-hall/198[1-2]/
            docs/data/198[1-2]/
            docs/data/index.json
            reports/*198[1-2]*
            metadata/sources/hitachi-city-hall-198[1-2].yaml
            metadata/backfill-1997-1953.json
          if-no-files-found: warn

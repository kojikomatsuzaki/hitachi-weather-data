name: Apply prepared 2025 workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-prepared-2025-workflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared files
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/hitachi-files.tar.gz
          tar -xzf /tmp/hitachi-files.tar.gz
          rm .github/workflows/apply-prepared-2025-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "全年採録方針と2025年生成ワークフローを追加"
          git push origin HEAD:main
